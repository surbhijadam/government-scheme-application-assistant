name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend - lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt flake8

      - name: Lint (syntax errors and undefined names only)
        run: flake8 app tests --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend - lint and import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: frontend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt flake8

      - name: Lint (syntax errors and undefined names only)
        run: flake8 . --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check api_client imports cleanly
        run: python -c "import api_client"

  docker:
    name: Docker - build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose --env-file .env.docker.example config --quiet

      - name: Build backend image
        run: docker build ./backend

      - name: Build frontend image
        run: docker build ./frontend